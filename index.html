<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
  <link  rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ── Ambient orbs ── -->
  <div  class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

    <div  class="app-shell">

    <!-- ════ HEADER ════ -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">
          <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
            <rect x="2" y="2" width="10" height="10" rx="3" fill="var(--accent)"/>
            <rect x="14" y="2" width="10" height="10" rx="3" fill="var(--accent)" opacity=".5"/>
            <rect x="2" y="14" width="10" height="10" rx="3" fill="var(--accent)" opacity=".5"/>
            <rect x="14" y="14" width="10" height="10" rx="3" fill="var(--accent)"/>
          </svg>
        </span>
        <span class="logo-text">Task<em>Flow</em></span>
      </div>

      <div class="header-stats">
        <div class="stat-pill"  id="stat-total"><span id="cnt-total">0</span> tasks</div>
        <div class="stat-pill  done" id="stat-done"><span id="cnt-done">0</span> done</div>
      </div>
    </header>

    <!-- ════ ADD TASK PANEL ════ -->
    <section class="add-panel" id="addPanel">
      <div class="add-panel-inner">
        <h1 class="headline">What needs<br/><em>doing today?</em></h1>

        <div class="form-group">
          <input
            type="text"
            id="taskTitle"
            class="input-field"
            placeholder="Task title…"
            maxlength="200"
            autocomplete="off"
          />
          <textarea
            id="taskDesc"
            class="input-field textarea"
            placeholder="Add a note (optional)"
            rows="2"
            maxlength="500"
          ></textarea>
          <button class="btn-add" id="addBtn" onclick="addTask()">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M9 3v12M3 9h12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
            Add Task
          </button>
        </div>
      </div>
    </section>

    <!-- ════ FILTER BAR ════ -->
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all"   onclick="setFilter(this,'all')">All</button>
      <button class="filter-btn"        data-filter="todo"  onclick="setFilter(this,'todo')">To Do</button>
      <button class="filter-btn"        data-filter="done"  onclick="setFilter(this,'done')">Done</button>
    </div>

    <!-- ════ TASK LIST ════ -->
    <main class="task-list" id="taskList">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">✦</div>
        <p>No tasks yet — add one above.</p>
      </div>
    </main>

  </div><!-- /app-shell -->

  <!-- ════ EDIT MODAL ════ -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <h2 class="modal-title">Edit Task</h2>
      <input  type="hidden" id="editId" />
      <input  type="text"   id="editTitle" class="input-field" placeholder="Title" maxlength="200" />
      <textarea             id="editDesc"  class="input-field textarea" placeholder="Note" rows="3" maxlength="500"></textarea>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-save"   onclick="saveEdit()">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- ════ TOAST ════ -->
  <div class="toast" id="toast"></div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
 </body>
</html>
